name: Build APK
on: [push, workflow_dispatch]

env:
  MINIAPPS_TOKEN: ${{ secrets.MINIAPPS_TOKEN }}

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unzip the newest uploaded project zip
        run: |
          ZIP=$(for f in upande-apps*.zip; do [ -f "$f" ] && echo "$(git log -1 --format=%ct -- "$f") $f"; done | sort -n | tail -1 | cut -d' ' -f2-)
          if [ -n "$ZIP" ]; then
            echo "Using: $ZIP"
            rm -rf upande-apps && unzip -q -o "$ZIP"
            echo "APP_DIR=upande-apps" >> $GITHUB_ENV
          else
            echo "APP_DIR=." >> $GITHUB_ENV
          fi
          DIR=$([ -n "$ZIP" ] && echo upande-apps || echo .)
          [ -f "$DIR/scripts/prepare-miniapps.mjs" ] || { echo "::error::$ZIP is an old version of the project. Upload the latest upande-apps.zip."; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Pull in the mini apps
        working-directory: ${{ env.APP_DIR }}
        run: node scripts/prepare-miniapps.mjs --fresh

      - name: Install
        working-directory: ${{ env.APP_DIR }}
        run: |
          npm install --no-audit --no-fund --legacy-peer-deps
          npx expo install --fix -- --legacy-peer-deps --no-audit --no-fund

      - name: Generate Android project
        working-directory: ${{ env.APP_DIR }}
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: ${{ env.APP_DIR }}/android
        run: ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: upande-apps-apk
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/release/*.apk
