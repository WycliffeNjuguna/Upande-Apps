name: Build APK
on: [push, workflow_dispatch]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project if uploaded as a zip
        run: |
          ls -la
          if [ -f upande-apps.zip ]; then unzip -q -o upande-apps.zip && echo "APP_DIR=upande-apps" >> $GITHUB_ENV; else echo "APP_DIR=." >> $GITHUB_ENV; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install
        working-directory: ${{ env.APP_DIR }}
        run: |
          npm ci
          npm install react-native-safe-area-context@5.11.1 --no-save
          echo "safe-area version: $(node -p "require('react-native-safe-area-context/package.json').version")"
      - name: Build release APK
        working-directory: ${{ env.APP_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: upande-apps-apk
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/release/*.apk
