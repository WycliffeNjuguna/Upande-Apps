name: Build APK
on: [push, workflow_dispatch]

env:
  MINIAPPS_TOKEN: ${{ secrets.MINIAPPS_TOKEN }}

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project if uploaded as a zip
        run: |
          if [ -f upande-apps.zip ]; then unzip -q -o upande-apps.zip && echo "APP_DIR=upande-apps" >> $GITHUB_ENV; else echo "APP_DIR=." >> $GITHUB_ENV; fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Pull in the mini apps
        working-directory: ${{ env.APP_DIR }}
        run: node scripts/prepare-miniapps.mjs --fresh

      - name: Install
        working-directory: ${{ env.APP_DIR }}
        run: |
          npm install --no-audit --no-fund --legacy-peer-deps
          npx expo install --fix -- --legacy-peer-deps --no-audit --no-fund

      - name: Generate Android project
        working-directory: ${{ env.APP_DIR }}
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: ${{ env.APP_DIR }}/android
        run: ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: upande-apps-apk
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/release/*.apk
